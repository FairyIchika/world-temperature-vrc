
name: Update world temperature

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update temperature
        run: |
          cd vrc_world_temperature
          python update_temperature.py
          cp temperature.txt ../temperature.txt
          cp temperature.json ../temperature.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temperature.txt temperature.json
          git diff --cached --quiet || git commit -m "Update temperature"
          git push
