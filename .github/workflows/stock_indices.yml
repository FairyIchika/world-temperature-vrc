
name: Update Global Stock Indices

on:
  workflow_dispatch:
  schedule:
    # 07:30 JST (previous day 22:30 UTC)
    - cron: '30 22 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install stock data dependency
        run: python -m pip install 'yfinance>=0.2.60,<2'

      - name: Generate daily stock indices
        run: python scripts/generate_stock_indices.py

      - name: Commit fresh index data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock_indices.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily stock indices'
            git push
          fi
